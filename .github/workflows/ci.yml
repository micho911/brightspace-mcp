name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - if: runner.os == 'macOS'
        run: echo "CGO_ENABLED=1" >> "$GITHUB_ENV"
      - name: gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go test ./...
      - if: runner.os != 'Windows'
        run: go test -race ./...
      - run: go build ./...
